<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="barza — hello world. Something amazing is coming." />
  <title>barza — hello world</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #f5f5f7;
      --accent: #7c6cff;
      --accent-2: #4ecdc4;
      --muted: #8a8a93;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 480px; height: 480px; background: var(--accent); top: -140px; left: -120px; }
    .orb-2 { width: 420px; height: 420px; background: var(--accent-2); bottom: -160px; right: -100px; animation-delay: -6s; }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, 40px) scale(1.15); }
    }
    main {
      text-align: center;
      z-index: 1;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-2);
      border: 1px solid rgba(78, 205, 196, 0.4);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.8s ease both;
    }
    h1 {
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(90deg, var(--fg) 20%, var(--accent) 60%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeUp 0.8s ease 0.15s both;
    }
    .sub {
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      animation: fadeUp 0.8s ease 0.3s both;
    }
    .dot { color: var(--accent); }
    footer {
      position: absolute;
      bottom: 1.5rem;
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      animation: fadeUp 0.8s ease 0.45s both;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <main>
    <span class="badge">project barza</span>
    <h1>hello world<span class="dot">.</span></h1>
    <p class="sub">something amazing is being built here.</p>
  </main>
  <footer>
    barza &mdash; hosted on <a href="https://github.com/enderPeer/barza">GitHub</a>
  </footer>
</body>
</html>
